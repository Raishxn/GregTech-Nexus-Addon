# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.
# This workflow will build a Java project with Gradle and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-gradle

name: Java CI with Gradle

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Code quality (spotless) + unit tests
      run: ./gradlew spotlessCheck runUnitTests

    # Generated resources are tracked; if datagen produces a diff the committed en_us/assets are stale.
    - name: Data generation is deterministic
      run: |
        ./gradlew runData
        if ! git diff --quiet -- src/generated; then
          echo "::error::runData changed generated resources; run ./gradlew runData and commit the result"
          git --no-pager diff --stat -- src/generated
          exit 1
        fi
        echo "datagen is deterministic"

    # runGameTestServer exits 0 even when the mod fails to load, so the log banner is the real
    # assertion. Without this guard a broken build passes silently.
    - name: Game tests
      run: |
        # run/ is gitignored, so CI has to accept the EULA the dedicated server asks for.
        mkdir -p run
        echo "eula=true" > run/eula.txt
        ./gradlew runGameTestServer

    - name: Assert game tests actually ran
      run: |
        if ! grep -q "GAME TESTS COMPLETE" run/logs/latest.log; then
          echo "::error::runGameTestServer finished without running any GameTest"
          tail -n 200 run/logs/latest.log
          exit 1
        fi
        grep -E "All [0-9]+ required tests passed|GAME TESTS COMPLETE" run/logs/latest.log
