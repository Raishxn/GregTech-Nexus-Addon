buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
        maven { url = 'https://maven.parchmentmc.org' }
        mavenCentral()
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id "idea"
    id "eclipse"
    id "maven-publish"
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = maven_group
base { archivesName = archives_base_name }

sourceSets {
    main.resources {
        srcDir 'src/generated/resources'
    }
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: 'official', version: "${minecraft_version}"
    copyIdeResources = true

    runs {
        configureEach {
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }
        client {
            workingDirectory project.file('run')
            property 'mixin.debug.export', 'true'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            args '--refresh-dependencies'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'mixin.debug.export', 'true'
            property 'forge.enabledGameTestNamespaces', project.mod_id
            args '--nogui', '--world', 'world-extra'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
        data {
            workingDirectory project.file('run')
            args '--mod', project.mod_id, '--all',
                 '--output', file('src/generated/resources/').getAbsolutePath(),
                 '--existing', file('src/main/resources/').getAbsolutePath(),
                 '--existing-mod', 'gtceu'
            mods {
                "${mod_id}" { source sourceSets.main }
            }
        }
    }
}

mixin {
    add sourceSets.main, "mixins.${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}

jar {
    manifest.attributes([
            "MixinConfigs": "gtna.mixins.json"
    ])
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'GTCEu Maven'
        url = 'https://maven.gtceu.com'
        content {
            includeGroup 'com.gregtechceu.gtceu'
        }
    }
    maven {
        name = "Latvian"
        url = "https://maven.latvian.dev/releases"
        content {
            includeGroup "dev.latvian.mods"
        }
    }
    maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
        content {
            includeGroup "dev.architectury"
        }
    }
    maven {
        name 'FirstDarkDev'
        url "https://maven.firstdark.dev/snapshots/"
    }
    maven { // Registrate
        url = "https://maven.tterrag.com/"
        content {
            includeGroup("com.tterrag.registrate")
        }
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com/"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        url "https://cursemaven.com/"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven {
        url = "https://thedarkcolour.github.io/KotlinForForge/"
    }
}

dependencies {
    def isDataRun = gradle.startParameter.taskNames.any { it.toLowerCase(java.util.Locale.ROOT).contains("rundata") }

    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    compileOnly("org.jetbrains:annotations:26.0.1")
    annotationProcessor('org.spongepowered:mixin:0.8.5:processor')

    // JEI, EMI, Jade
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("dev.emi:emi-forge:${emi_version}+${minecraft_version}")
    compileOnly fg.deobf("curse.maven:jade-324717:5390389")
    if (!isDataRun) {
        runtimeOnly fg.deobf("curse.maven:jade-324717:5390389")
    }

    // GregTech and dependencies
    implementation fg.deobf("com.gregtechceu.gtceu:gtceu-${minecraft_version}:${gtceu_version}:slim") { transitive = false }
    implementation fg.deobf("com.lowdragmc.ldlib:ldlib-forge-${minecraft_version}:${ldlib_version}") { transitive = false }
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation fg.deobf("dev.toma.configuration:configuration-forge-${minecraft_version}:${configuration_version}")

    // lombok
    compileOnly 'org.projectlombok:lombok:1.18.24'
    annotationProcessor 'org.projectlombok:lombok:1.18.24'

    // extendedAE and Glodium
    implementation fg.deobf("curse.maven:glodium-957920:5226922")
    implementation fg.deobf("curse.maven:ex-pattern-provider-892005:7248944")
    // gtmthings
    implementation fg.deobf("curse.maven:gtmthings-1104310:6843500")
    // AE2 and GuideME
    implementation fg.deobf("curse.maven:applied-energistics-2-223794:7148487")
    implementation fg.deobf("curse.maven:guideme-1173950:7127447")

    implementation fg.deobf("curse.maven:configuration-444699:5840405")

    // FTB Teams + FTB Library — local jars in libs/ (compileOnly soft deps)
    compileOnly fileTree(dir: 'libs', include: '*.jar')

    // KubeJS soft dependency
    compileOnly fg.deobf("dev.latvian.mods:kubejs-forge:2001.6.5-build.16")

    implementation fg.deobf("curse.maven:gtceu-terminals-1423461:7787678")

    compileOnly fg.deobf("curse.maven:modern-ui-352491:6956345")
    if (!isDataRun) {
        runtimeOnly fg.deobf("curse.maven:modern-ui-352491:6956345")
    }
}

tasks.named('processResources', ProcessResources).configure {
    duplicatesStrategy = DuplicatesStrategy.WARN
    var properties = [
            "mod_license": mod_license,
            "mod_id": mod_id,
            "version": version,
            "mod_name": mod_name,
            "mod_url": mod_url,
            "mod_author": mod_author,
            "forge_version": forge_version.split("\\.")[0],
            "minecraft_version": minecraft_version,
            "gtceu_version": gtceu_version,
    ]
    inputs.properties(properties)

    filesMatching("META-INF/mods.toml") {
        expand properties + [project: project]
    }

    doLast {
        def manualEnUs = file("src/main/resources/assets/gtna/lang/en_us.json")
        def generatedEnUs = file("src/generated/resources/assets/gtna/lang/en_us.json")
        def mergedEnUs = file("$destinationDir/assets/gtna/lang/en_us.json")
        def slurper = new groovy.json.JsonSlurper()
        Map<String, Object> merged = [:]

        if (manualEnUs.exists()) {
            merged.putAll(slurper.parse(manualEnUs) as Map<String, Object>)
        }
        if (generatedEnUs.exists()) {
            merged.putAll(slurper.parse(generatedEnUs) as Map<String, Object>)
        }

        if (!merged.isEmpty()) {
            mergedEnUs.parentFile.mkdirs()
            mergedEnUs.text = groovy.json.JsonOutput.prettyPrint(
                    groovy.json.JsonOutput.toJson(new TreeMap<>(merged))
            ) + System.lineSeparator()
        }
    }
}

tasks.named('jar', Jar).configure { finalizedBy 'reobfJar' }
tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
    options.release.set(17)
    options.compilerArgs << "-Aquiet=true"
}
